spring.application.name=apiXyPiero

# Misma base que MediConnect; las tablas del examen estan en el schema "examen"
spring.datasource.url=jdbc:postgresql://localhost:5432/HealthLink
spring.datasource.username=postgres
spring.datasource.password=mi_nueva
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
